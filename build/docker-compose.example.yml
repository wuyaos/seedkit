services:
  seedkit:
    image: seedkit:local
    build:
      context: ..
      dockerfile: build/Dockerfile
    container_name: seedkit
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"  # public access: configure HTTPS proxy first
    volumes:
      - ./data:/data                    # relative to this compose file
      - /path/to/media:/media:rw        # use ro if source writes are not needed
    environment:
      TZ: Asia/Shanghai
